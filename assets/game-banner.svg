<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="170" viewBox="0 0 800 170" role="img" aria-label="Play Butterfly Catch">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f5ff"/>
      <stop offset="0.6" stop-color="#e6fcf5"/>
      <stop offset="1" stop-color="#fff9db"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#748ffc"/>
      <stop offset="1" stop-color="#5c7cfa"/>
    </linearGradient>
    <linearGradient id="pinkA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6fa5"/><stop offset="1" stop-color="#ffc2d9"/></linearGradient>
    <linearGradient id="blueA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#74c0fc"/><stop offset="1" stop-color="#d0ebff"/></linearGradient>
    <linearGradient id="goldA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59f00"/><stop offset="1" stop-color="#ffec99"/></linearGradient>
    <clipPath id="card"><rect x="2" y="2" width="796" height="166" rx="22"/></clipPath>

    <path id="upper" d="M0,-1 C-5,-17 -25,-24 -24,-9 C-23,-1 -9,2 0,0 Z"/>
    <path id="lower" d="M0,1 C-9,2 -19,9 -15,17 C-11,23 -2,13 0,3 Z"/>
    <g id="body">
      <ellipse rx="1.8" ry="9" fill="#6b4a5a"/>
      <path d="M-0.5,-8 Q-3,-15 -6.5,-17 M0.5,-8 Q3,-15 6.5,-17" stroke="#6b4a5a" stroke-width="1" fill="none" stroke-linecap="round"/>
    </g>
    <g id="bfPink"><g><use href="#upper" xlink:href="#upper" fill="url(#pinkA)"/><use href="#lower" xlink:href="#lower" fill="url(#pinkA)"/><use href="#upper" xlink:href="#upper" fill="url(#pinkA)" transform="scale(-1 1)"/><use href="#lower" xlink:href="#lower" fill="url(#pinkA)" transform="scale(-1 1)"/><animateTransform attributeName="transform" type="scale" values="1 1;0.15 1;1 1" dur="0.34s" repeatCount="indefinite"/></g><use href="#body" xlink:href="#body"/></g>
    <g id="bfBlue"><g><use href="#upper" xlink:href="#upper" fill="url(#blueA)"/><use href="#lower" xlink:href="#lower" fill="url(#blueA)"/><use href="#upper" xlink:href="#upper" fill="url(#blueA)" transform="scale(-1 1)"/><use href="#lower" xlink:href="#lower" fill="url(#blueA)" transform="scale(-1 1)"/><animateTransform attributeName="transform" type="scale" values="1 1;0.15 1;1 1" dur="0.4s" repeatCount="indefinite"/></g><use href="#body" xlink:href="#body"/></g>
    <g id="bfGold"><g><use href="#upper" xlink:href="#upper" fill="url(#goldA)"/><use href="#lower" xlink:href="#lower" fill="url(#goldA)"/><use href="#upper" xlink:href="#upper" fill="url(#goldA)" transform="scale(-1 1)"/><use href="#lower" xlink:href="#lower" fill="url(#goldA)" transform="scale(-1 1)"/><animateTransform attributeName="transform" type="scale" values="1 1;0.15 1;1 1" dur="0.3s" repeatCount="indefinite"/></g><use href="#body" xlink:href="#body"/></g>
    <path id="spark" d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10 Z"/>
    <path id="flightA" d="M-40,120 C120,40 220,150 380,90 S620,30 840,100"/>
    <path id="flightB" d="M840,50 C660,130 520,20 380,120 S140,60 -40,70"/>
    <path id="flightC" d="M-40,40 C160,110 300,20 440,60 S700,140 840,60"/>
  </defs>

  <g clip-path="url(#card)">
    <rect x="2" y="2" width="796" height="166" rx="22" fill="url(#sky)"/>
    <rect x="2" y="152" width="796" height="16" fill="#d3f9d8"/>
    <g fill="#e5dbff"><circle cx="60" cy="150" r="6"/><circle cx="210" cy="152" r="5"/><circle cx="600" cy="150" r="6"/><circle cx="740" cy="152" r="5"/></g>
    <g fill="#d0ebff"><circle cx="130" cy="152" r="5"/><circle cx="520" cy="151" r="6"/><circle cx="680" cy="150" r="5"/></g>

    <g fill="#b197fc">
      <g transform="translate(120 40)"><g transform="scale(0)"><use href="#spark" xlink:href="#spark"/><animateTransform attributeName="transform" type="scale" values="0;0.7;0" dur="2.1s" repeatCount="indefinite"/></g></g>
      <g transform="translate(700 120)"><g transform="scale(0)"><use href="#spark" xlink:href="#spark"/><animateTransform attributeName="transform" type="scale" values="0;0.6;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></g></g>
    </g>
    <g fill="#fcc419">
      <g transform="translate(660 36)"><g transform="scale(0)"><use href="#spark" xlink:href="#spark"/><animateTransform attributeName="transform" type="scale" values="0;0.8;0" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></g></g>
      <g transform="translate(90 110)"><g transform="scale(0)"><use href="#spark" xlink:href="#spark"/><animateTransform attributeName="transform" type="scale" values="0;0.5;0" dur="2s" begin="1.1s" repeatCount="indefinite"/></g></g>
    </g>

    <g>
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto"><mpath href="#flightA" xlink:href="#flightA"/></animateMotion>
      <g transform="scale(0.9)"><g><use href="#bfPink" xlink:href="#bfPink"/><animateTransform attributeName="transform" type="rotate" values="80;100;84;96;80" dur="1.4s" repeatCount="indefinite"/></g></g>
    </g>
    <g>
      <animateMotion dur="11s" begin="-4s" repeatCount="indefinite" rotate="auto"><mpath href="#flightB" xlink:href="#flightB"/></animateMotion>
      <g transform="scale(0.75)"><g><use href="#bfBlue" xlink:href="#bfBlue"/><animateTransform attributeName="transform" type="rotate" values="80;102;84;98;80" dur="1.7s" repeatCount="indefinite"/></g></g>
    </g>
    <g>
      <animateMotion dur="7s" begin="-2s" repeatCount="indefinite" rotate="auto"><mpath href="#flightC" xlink:href="#flightC"/></animateMotion>
      <g transform="scale(0.7)"><g><use href="#bfGold" xlink:href="#bfGold"/><animateTransform attributeName="transform" type="rotate" values="78;102;84;96;78" dur="1.2s" repeatCount="indefinite"/></g></g>
    </g>

    <!-- net swinging in from the right -->
    <g transform="translate(610 78)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;-18;6;0" keyTimes="0;0.4;0.7;1" dur="2.2s" repeatCount="indefinite"/>
        <line x1="26" y1="26" x2="70" y2="70" stroke="#b08968" stroke-width="5" stroke-linecap="round"/>
        <circle r="34" fill="#ffffff" fill-opacity="0.55" stroke="#4c6ef5" stroke-width="3"/>
        <path d="M-24,-24 L24,24 M-12,-32 L32,12 M-32,-12 L12,32 M24,-24 L-24,24 M12,-32 L-32,12 M32,-12 L-12,32" stroke="#4c6ef5" stroke-opacity="0.25" stroke-width="1"/>
      </g>
    </g>
  </g>

  <rect x="2" y="2" width="796" height="166" rx="22" fill="none" stroke="#bac8ff" stroke-width="3"/>

  <text x="60" y="72" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#4263eb">Butterfly Catch</text>
  <text x="60" y="100" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#5c677d">Catch butterflies, grab the golden ones, dodge the bees.</text>

  <g transform="translate(60 114)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="1.4s" repeatCount="indefinite" additive="sum"/>
      <rect width="150" height="36" rx="18" fill="#3b5bdb" y="3"/>
      <rect width="150" height="36" rx="18" fill="url(#btn)"/>
      <path d="M26,11 L26,25 L38,18 Z" fill="#fff"/>
      <text x="88" y="24" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff">PLAY NOW</text>
    </g>
  </g>
</svg>
